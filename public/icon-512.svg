<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#17171c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#262626" stroke-width="4" opacity="0.6" />

  <!-- Outer Speedometer Arc -->
  <path d="M 106 350 A 180 180 0 1 1 406 350" fill="none" stroke="#262626" stroke-width="28" stroke-linecap="round" />
  <path d="M 106 350 A 180 180 0 1 1 360 170" fill="none" stroke="url(#cyanGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Gauge Accent -->
  <circle cx="256" cy="256" r="110" fill="#121215" stroke="url(#emeraldGrad)" stroke-width="10" />

  <!-- Digital Steering Wheel / Drive Icon -->
  <path d="M 256 160 C 200 160 160 200 160 256 C 160 312 200 352 256 352 C 312 352 352 312 352 256 C 352 200 312 160 256 160 Z M 256 185 C 295 185 327 217 327 256 C 327 270 323 283 315 294 L 280 256 L 256 256 L 232 256 L 197 294 C 189 283 185 270 185 256 C 185 217 217 185 256 185 Z" fill="url(#cyanGrad)" />

  <!-- Center Hub Light -->
  <circle cx="256" cy="256" r="18" fill="#10b981" filter="url(#glow)" />

  <!-- Brand Text -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">DRIVEPILOT</text>
  <text x="256" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#06b6d4" text-anchor="middle" letter-spacing="6">AI COCKPIT</text>
</svg>
